# Generated by axiom (scripts/theme_hyprlock.sh) from the "${THEME_NAME}" theme.
# Rewritten on every theme or wallpaper change: edit the template instead.

general {
    hide_cursor = true
}

background {
    monitor =
    path = ${WALLPAPER}
    color = rgb(${BACKGROUND})
    blur_passes = ${BLUR_PASSES}
    blur_size = 3
    brightness = 0.8
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 3
    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    outer_color = rgb(${ACCENT})
    inner_color = rgb(${BACKGROUND_ALT})
    font_color = rgb(${FOREGROUND})
    check_color = rgb(${ACCENT_ALT})
    fail_color = rgb(${ERROR})
    font_family = ${FONT}
    fade_on_empty = true
    placeholder_text = <i>${PLACEHOLDER}</i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

# Clock ($TIME is hyprlock's own variable)
label {
    monitor =
    text = $TIME
    color = rgb(${ACCENT})
    font_size = 36
    font_family = ${FONT}
    shadow_passes = 3
    shadow_size = 4
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = <i>${GREETING}</i>
    color = rgb(${FOREGROUND})
    font_size = 64
    font_family = ${FONT}
    shadow_passes = 3
    shadow_size = 4
    position = 0, 16
    halign = center
    valign = center
}
